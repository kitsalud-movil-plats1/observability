---
- name: Paquetes instalados
  ansible.builtin.package_facts:

# Con la configuración de fábrica escucharía en todas las direcciones, así que
# se instala sin arrancar y arranca solo con la configuración del kit
- name: Impedir que el paquete arranque node_exporter al instalarse
  ansible.builtin.copy:
    dest: /usr/sbin/policy-rc.d
    content: "#!/bin/sh\nexit 101\n"
    mode: "0755"
    force: false
  register: node_exporter_policy
  when: "'prometheus-node-exporter' not in ansible_facts.packages"

- name: node_exporter con versión fija
  when: >-
    'prometheus-node-exporter' not in ansible_facts.packages or
    ansible_facts.packages['prometheus-node-exporter'][0].version != version_node_exporter
  block:
    - name: Paquete prometheus-node-exporter
      ansible.builtin.apt:
        name: "prometheus-node-exporter={{ version_node_exporter }}"
        state: present
        install_recommends: false
        update_cache: true
        cache_valid_time: 3600
  always:
    - name: Quitar el bloqueo de arranque
      ansible.builtin.file:
        path: /usr/sbin/policy-rc.d
        state: absent
      when: node_exporter_policy is changed

- name: Retener node_exporter
  ansible.builtin.dpkg_selections:
    name: prometheus-node-exporter
    selection: hold

- name: Argumentos de node_exporter
  ansible.builtin.template:
    src: prometheus-node-exporter.j2
    dest: /etc/default/prometheus-node-exporter
    owner: root
    group: root
    mode: "0644"
  notify: Reiniciar node_exporter

- name: node_exporter activo al arrancar
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    enabled: true
    state: started

# Solo kit01 lee las métricas y hace las sondas (F-14). La Comunidad ya la
# corta nftables en kit01; aquí queda una segunda barrera.
- name: node_exporter y puertos de las sondas desde kit01
  community.general.ufw:
    rule: allow
    proto: tcp
    port: "{{ item.1 }}"
    from_ip: "{{ item.0 }}"
    comment: monitoreo desde kit01
  loop: "{{ monitoreo_origenes | product(['9100'] + monitoreo_puertos) | list }}"
  when: comun_ufw | bool
